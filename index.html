<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16:9白余白ツール</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --text:#1f2430; --muted:#6b7280;
  --border:#d9dce3; --accent:#2563eb; --accent-text:#ffffff; --accent-soft:#e8efff;
  --preview-border:#c9ccd3; --warn:#b45309; --warn-bg:#fef3c7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171c; --surface:#1e232b; --text:#e6e8ec; --muted:#9aa2af;
    --border:#343b46; --accent:#5b8def; --accent-text:#0b1220; --accent-soft:#222c40;
    --preview-border:#5a626f; --warn:#fcd34d; --warn-bg:#3a2f10;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;padding:24px 16px;overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px;font-size:.9rem}
.drop{border:2px dashed var(--border);background:var(--surface);border-radius:12px;padding:28px 16px;text-align:center;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0 0 12px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:8px;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:16px 0}
.bar fieldset{border:0;margin:0;padding:0;display:flex;gap:16px;align-items:center}
.bar legend{float:left;padding:0;margin-right:12px;font-weight:600}
.bar label{cursor:pointer}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;border-radius:8px}
.thumb canvas,.thumb img{max-width:100%;height:auto;max-height:240px;border:1px solid var(--preview-border);display:block}
.name{font-weight:600;word-break:break-all;font-size:.9rem}
.meta{color:var(--muted);font-size:.85rem}
.skip{background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:8px;font-size:.85rem;font-weight:600}
.err{color:#dc2626;font-size:.85rem}
.bar input[type=number]{font:inherit;width:6em;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.bar input[type=number].invalid{border-color:#dc2626;outline:2px solid #dc2626}
.hint{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>16:9白余白ツール</h1>
  <p class="lead">縦長画像の左右に白い余白を付けて16:9にします。画像はブラウザ内だけで処理され、外部には送信されません。</p>

  <div class="drop" id="drop">
    <p>ここに画像をドラッグ＆ドロップ（jpg / png / webp、複数可）</p>
    <button type="button" class="primary" id="pick">ファイルを選択</button>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </div>

  <div class="bar">
    <fieldset>
      <legend>出力形式</legend>
      <label><input type="radio" name="fmt" value="jpg" checked> JPG（品質0.95）</label>
      <label><input type="radio" name="fmt" value="png"> PNG</label>
    </fieldset>
    <fieldset>
      <legend>出力サイズ</legend>
      <label><input type="radio" name="size" value="width" checked> 横幅を指定</label>
      <span><input type="number" id="outw" value="640" min="16" max="8000" step="1" aria-label="出力の横幅（px）"> px</span>
      <span class="hint" id="sizeHint">→ 640×360</span>
      <label><input type="radio" name="size" value="orig"> リサイズしない（元の高さのまま）</label>
    </fieldset>
    <span class="spacer"></span>
    <button type="button" class="primary" id="zip" disabled>すべてZIPでダウンロード</button>
    <button type="button" id="clear" disabled>クリア</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">画像がまだありません</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  'use strict';
  var items = []; // {file, img, w, h, skip, blob, outW, outH, outName, url, error}
  var $ = function(id){ return document.getElementById(id); };
  var grid = $('grid'), empty = $('empty'), zipBtn = $('zip'), clearBtn = $('clear'), drop = $('drop');
  var seq = 0;
  var outwInput = $('outw'), sizeHint = $('sizeHint');
  var lastW = 640; // 直近の有効な横幅指定（入力が不正な間もこの値で加工する）

  function fmt(){ return document.querySelector('input[name="fmt"]:checked').value; }
  function sizeMode(){ return document.querySelector('input[name="size"]:checked').value; }

  // 横幅入力の検証（空・小数・範囲外は null）
  function readWidth(){
    var v = outwInput.value.trim();
    if (!/^\d+$/.test(v)) return null;
    var n = parseInt(v, 10);
    return (n >= 16 && n <= 8000) ? n : null;
  }

  // 高さ表示の更新（リサイズしない時は入力欄を無効化して表示を消す）
  function updateHint(){
    var n = readWidth();
    sizeHint.textContent = n === null ? '' : '→ ' + n + '×' + Math.round(n * 9 / 16);
    var off = sizeMode() === 'orig';
    outwInput.disabled = off;
    if (off) sizeHint.textContent = '';
  }

  function loadImage(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ res({img:img, url:url}); };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
      img.src = url;
    });
  }

  function toBlob(canvas, type, q){
    return new Promise(function(res){ canvas.toBlob(res, type, q); });
  }

  // 加工本体: 幅計算・配置（横幅指定時は最後に段階縮小）
  async function process(it){
    var w = it.w, h = it.h;
    var baseW = Math.round(h * 16 / 9);
    if (w >= baseW){ it.skip = true; return; }
    it.skip = false;
    var canvas = document.createElement('canvas');
    canvas.width = baseW; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, baseW, h);
    var left = Math.floor((baseW - w) / 2);
    ctx.drawImage(it.img, left, 0, w, h);
    var outW = baseW, outH = h, enlarged = false, name = '_16x9';
    if (sizeMode() === 'width'){
      outW = lastW; outH = Math.round(outW * 9 / 16);
      enlarged = outW > baseW;
      // 目標の2倍より大きい間は半分ずつ縮小する
      while (canvas.width > outW * 2){
        canvas = shrink(canvas, Math.round(canvas.width / 2), Math.round(canvas.height / 2));
      }
      canvas = shrink(canvas, outW, outH);
      left = Math.round(left * outW / baseW);
      name = '_' + outW + 'x' + outH;
    }
    var isJpg = fmt() === 'jpg';
    var blob = await toBlob(canvas, isJpg ? 'image/jpeg' : 'image/png', isJpg ? 0.95 : undefined);
    if (!blob) throw new Error('出力に失敗しました');
    if (it.url) URL.revokeObjectURL(it.url);
    it.blob = blob; it.outW = outW; it.outH = outH; it.left = left; it.enlarged = enlarged;
    it.url = URL.createObjectURL(blob);
    var base = it.file.name.replace(/\.[^.]+$/, '');
    it.outName = base + name + '.' + (isJpg ? 'jpg' : 'png');
  }

  // 白背景の新しいキャンバスへ指定サイズで描画
  function shrink(src, tw, th){
    var c = document.createElement('canvas');
    c.width = tw; c.height = th;
    var cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, tw, th);
    cx.imageSmoothingEnabled = true;
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(src, 0, 0, tw, th);
    return c;
  }

  async function reprocessAll(){
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (it.error) continue;
      try { await process(it); } catch(e){ it.error = e.message; }
    }
    render();
  }

  async function addFiles(fileList){
    var files = Array.prototype.filter.call(fileList, function(f){
      return /^image\/(jpeg|png|webp)$/.test(f.type);
    });
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      var it = {id: ++seq, file: f};
      try {
        var r = await loadImage(f);
        it.img = r.img; it.srcUrl = r.url;
        it.w = r.img.naturalWidth; it.h = r.img.naturalHeight;
        await process(it);
      } catch(e){ it.error = e.message; }
      items.push(it);
    }
    render();
  }

  function render(){
    grid.textContent = '';
    items.forEach(function(it){
      var card = document.createElement('div'); card.className = 'card';
      var name = document.createElement('div'); name.className = 'name'; name.textContent = it.file.name;
      card.appendChild(name);
      var thumb = document.createElement('div'); thumb.className = 'thumb';
      var meta = document.createElement('div'); meta.className = 'meta';
      if (it.error){
        var e = document.createElement('div'); e.className = 'err'; e.textContent = it.error; card.appendChild(e);
      } else if (it.skip){
        var im = document.createElement('img'); im.src = it.srcUrl; im.alt = it.file.name;
        thumb.appendChild(im); card.appendChild(thumb);
        var s = document.createElement('div'); s.className = 'skip'; s.textContent = '横長のため加工不要'; card.appendChild(s);
        meta.textContent = '元サイズ ' + it.w + '×' + it.h; card.appendChild(meta);
      } else {
        var im2 = document.createElement('img'); im2.src = it.url; im2.alt = it.outName;
        thumb.appendChild(im2); card.appendChild(thumb);
        meta.textContent = it.w + '×' + it.h + ' → ' + it.outW + '×' + it.outH + '（左右余白 ' + it.left + 'px' + (it.enlarged ? '・拡大' : '') + '）';
        card.appendChild(meta);
        var a = document.createElement('a'); a.className = 'btn primary'; a.href = it.url; a.download = it.outName;
        a.textContent = 'ダウンロード'; a.style.textAlign = 'center'; card.appendChild(a);
      }
      grid.appendChild(card);
    });
    var okCount = items.filter(function(i){ return !i.error && !i.skip; }).length;
    empty.style.display = items.length ? 'none' : '';
    zipBtn.disabled = okCount < 2;
    clearBtn.disabled = items.length === 0;
  }

  function clearAll(){
    items.forEach(function(it){
      if (it.url) URL.revokeObjectURL(it.url);
      if (it.srcUrl) URL.revokeObjectURL(it.srcUrl);
    });
    items = []; render();
  }

  async function downloadZip(){
    if (typeof JSZip === 'undefined'){ alert('ZIPライブラリを読み込めませんでした。ネットワーク接続を確認してください。'); return; }
    var zip = new JSZip(), used = {};
    items.forEach(function(it){
      if (it.error || it.skip) return;
      var n = it.outName, k = 1;
      while (used[n]){ n = it.outName.replace(/(\.[^.]+)$/, '_' + (++k) + '$1'); }
      used[n] = true; zip.file(n, it.blob);
    });
    var blob = await zip.generateAsync({type:'blob'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'images_16x9.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  $('pick').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(e){ addFiles(e.target.files); e.target.value = ''; });
  ['dragenter','dragover'].forEach(function(t){
    drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(t){
    drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function(e){ addFiles(e.dataTransfer.files); });
  document.querySelectorAll('input[name="fmt"]').forEach(function(r){ r.addEventListener('change', reprocessAll); });
  document.querySelectorAll('input[name="size"]').forEach(function(r){
    r.addEventListener('change', function(){ updateHint(); reprocessAll(); });
  });
  // 不正値の間は再生成せず赤枠にする
  outwInput.addEventListener('input', function(){
    var n = readWidth();
    outwInput.classList.toggle('invalid', n === null);
    updateHint();
    if (n === null) return;
    lastW = n;
    reprocessAll();
  });
  zipBtn.addEventListener('click', downloadZip);
  clearBtn.addEventListener('click', clearAll);
  updateHint();
  render();
})();
</script>
<script src="https://freetierinc-team.github.io/nav.js"></script>
</body>
</html>
